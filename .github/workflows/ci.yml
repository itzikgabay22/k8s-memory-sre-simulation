name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest
      - name: Compile
        run: python -m compileall -q app
      - name: Docker build
        run: docker build -t memory-hungry-api:ci .
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s >/tmp/rendered.yaml
